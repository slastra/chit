name: chit
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  desktop_drop: ^0.8.4
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  dynamic_color: ^2.1.0
  fetch_client: ^1.2.1
  file_picker: ^13.4.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.4
  flutter_riverpod: ^3.5.0
  flutter_svg: ^2.5.1
  go_router: ^18.1.4
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  material_ui: ^1.11.1
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  path_provider: ^2.1.6
  pdfrx: ^3.1.0
  record: ^7.2.0
  sqlite3: ^3.9.2
  timezone: ^0.11.2
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

# media_kit with libmpv's Lua scripts off; see third_party/media_kit/CHIT.md
dependency_overrides:
  media_kit:
    path: third_party/media_kit

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
